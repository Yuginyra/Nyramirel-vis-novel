<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nyramirel game</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--box:rgba(30,14,22,.9);--ink:#fff1ea;--dim:#d9b8b0;--rose:#ff7aa8;--line:rgba(255,160,140,.35);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--box:rgba(20,8,14,.92)}}
:root[data-theme="dark"]{--box:rgba(20,8,14,.92)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#120810}
body{font-family:'Fredoka',ui-rounded,'Segoe UI',system-ui,sans-serif;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none}
#scene{position:absolute;inset:0;transition:background .8s}
.bg-town{background:linear-gradient(#f6b79a,#c9748a 55%,#4b2a44)}
.bg-home{background:radial-gradient(circle at 50% 30%,#a8586a,#3d1d33 75%)}
.bg-dark{background:radial-gradient(circle at 50% 70%,#5a2630,#120810 70%)}
.bg-fire{background:radial-gradient(circle at 50% 65%,#ff4d6d,#8d1738 45%,#1a0610 85%);animation:pulse 1.6s ease-in-out infinite alternate}
.bg-dream{background-size:cover;background-position:center;filter:blur(10px) saturate(1.15);transform:scale(1.12)}
@keyframes pulse{to{filter:brightness(1.25) saturate(1.2)}}
#sprites{position:absolute;inset:0;pointer-events:none}
.sp{position:absolute;transition:opacity .35s,filter .35s;opacity:0;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.sp.on{opacity:1}.sp.dim{filter:brightness(.6) drop-shadow(0 10px 14px rgba(0,0,0,.35))}.sp.talk{animation:bob .5s ease-in-out infinite alternate}
.sp.chibi{bottom:25vh;width:min(44vw,320px)}.sp.chibi img{width:100%;height:auto;display:block}
.sp.half{bottom:9vh;height:min(60vh,520px)}.sp.half img{height:100%;width:auto;display:block}
#spN{left:3vw}#spM{right:3vw}#spT{right:4vw}
#spM.sil img{filter:brightness(0) drop-shadow(0 0 16px rgba(255,150,190,.95))}
@keyframes bob{to{transform:translateY(-8px)}}
#cg{position:absolute;inset:0 0 22vh;display:none;align-items:center;justify-content:center;pointer-events:none}
#cg img{max-height:100%;max-width:92vw;object-fit:contain;filter:drop-shadow(0 12px 22px rgba(0,0,0,.45))}
#ui{position:absolute;inset:auto 0 0 0;padding:0 3vw calc(env(safe-area-inset-bottom,0px) + 2.5vh);display:flex;justify-content:center;z-index:5}
#box{position:relative;width:min(100%,780px);min-height:21vh;background:var(--box);border:2px solid var(--line);border-radius:18px;padding:1.5rem 1.3rem 1.2rem;cursor:pointer}
#tw{max-height:34vh;overflow:auto}
#name{position:absolute;top:-1.05rem;left:1rem;background:var(--rose);color:#2a0d1a;font-weight:600;padding:.2rem 1rem;border-radius:999px;line-height:1.3}
#name:empty{display:none}
#txt{font-size:clamp(1.02rem,2.5vw,1.25rem);line-height:1.5;margin:0}
#txt.nar{color:var(--dim)}#txt.tho{font-style:italic;color:#ffd0e0}
#more{position:absolute;right:1rem;bottom:.4rem;color:var(--rose);animation:bob .6s infinite alternate}
.card{position:absolute;inset:0;background:rgba(14,5,10,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;padding:1.2rem;text-align:center}
#chap,#end{z-index:30;cursor:pointer}#set{z-index:40}
#menu{z-index:20;background:center/cover;justify-content:flex-end;padding-bottom:9vh}
#menu .shade{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(14,5,10,.88))}
#menu>*:not(.shade){position:relative}
.card h1,.card h2{margin:0;color:var(--rose);font-size:clamp(2rem,7vw,3.4rem);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.card p{margin:0;color:var(--dim)}
.card button{font:inherit;font-weight:600;color:#2a0d1a;background:var(--rose);border:0;border-radius:999px;padding:.7rem 2rem;font-size:1.15rem;cursor:pointer;min-height:48px;min-width:200px}
.card button.alt{background:var(--box);color:var(--ink);border:2px solid var(--rose)}
#gear{position:absolute;top:calc(env(safe-area-inset-top,0px) + .6rem);right:.8rem;z-index:50;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--box);color:var(--ink);font-size:1.4rem;cursor:pointer;line-height:1}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="scene" class="bg-town"></div>
<div id="sprites"><div class="sp chibi" id="spN"></div><div class="sp half" id="spM"></div><div class="sp half" id="spT"></div></div>
<div id="cg"></div>
<div id="ui"><div id="box" role="button" tabindex="0" aria-label="Continue"><div id="name"></div><div id="tw"><p id="txt"></p></div><span id="more">▾</span></div></div>
<div class="card" id="menu"><div class="shade"></div><h1>Nyra &amp; Mirel</h1><button id="play">Start</button></div>
<div class="card" id="chap"><h2 id="chapT"></h2></div>
<div class="card" id="end"><h2>The End</h2><p>Nyra &amp; Mirel</p><button id="again">Read again</button></div>
<div class="card" id="set"><h2>Settings</h2><button id="bResume">Resume</button><button id="bMenu" class="alt">Main menu</button><button id="bReset" class="alt">Reset game</button></div>
<button id="gear" aria-label="Settings">⚙</button>

['y','What are you selling here? I’ve been in this block lots of times and it’s the first time I see someone like you.','n'],
['t','Ah, well I am a traveling merchant and I sell my goods to only a select few. So you’re quite lucky to catch me! I sell all kinds of mystical wares and rituals of all sorts. They really work, trust me gng.'],
['~','Huh? I think you have been reading too many novels my guy, I really doubt that they are magical…','d'],
['t','Well if you doubt it then how about this! I will sell you one random ritual of your choosing for only 20% the price! And if it doesn’t work you can come and reclaim your money! I even have a contract if you don’t trust me! Look here!'],
['N','He slid over a paper which read:'],
['N','Sales Agreement. I, the undersigned seller, agree to sell the buyer one random ritual of the buyer’s chosen category for 20% of its standard market value. If the ritual is proven to be false, nonfunctional, or intentionally fraudulent, the buyer is entitled to a full refund upon presenting this contract. By signing below, both parties acknowledge and accept these terms. Seller: Tufel. Buyer: ____________'],
['~','Tufel huh, what an odd name… Well it seems like a pretty good deal so might as well. He’s a little pushy about it but I guess all salespeople have to be like that.','n'],
['y','Well what can your so-called rituals even achieve? Let me guess it lets me find my destined lover, or summons some demons from the Abyss! Maybe even…'],
['t','They do.'],
['t','Some of them do and there’s plenty more. Some can even give you magical powers if you wish so. Some can even grant you wisdom beyond your wildest dreams! And for only 20% price you CAN’T skip out!!'],
['y','Why so cheap anyways? You seem pretty urgent to get rid of them.'],
['t','Well when a guy is saying stuff about selling rituals most people won’t really buy it will they? Heck I wouldn’t be surprised if you wouldn’t as well, since you seem to be a student.'],
['y','Sure I’ll take one.','p'],
['N','Nyra is a mysticism enthusiast so her curiosity got the best of her.'],
['t','REALLY!?!?'],
['y','Yeah sure, I mean I got a guaranteed return so might as well. How much would 20% of it come to anyways?','n'],
['t','…a 100 money.'],
['~','It’s usually 500!!??? Now I understand why those fellas walked away earlier… well I do have some money saved up from the cafe I work at… let’s give it a shot why not.','s'],
['y','Sure I’ll try it, but you BETTER not be scamming me ya hear!','n'],
['N','She got 100 money from her wallet and gave it to him after signing the contract and snapping a picture of it just in case. Seller: Tufel. Buyer: Nyra. His eyes lit up with joy.'],
['t','Thank you very much! Ok now you may choose any scroll you want! Though what you will get is random so I wish you luck ^^!'],
['~','Guh, so this is like some gacha…','d'],
['N','There were hundreds of scrolls all over the place and after a minute of staring at her options she was stuck between two choices. The former looked more alluring than the rest, but the latter looked more magical. So of course she did a coinflip! It landed on heads and she ended up picking the former.'],
['t','I see, a nice choice dear customer! The instructions on the ritual are written on the back so no need to fret about it, I hope it fits your needs!'],
['y','Yep, I’ll try it out as soon as I get home so you better not go anywhere if it doesn’t work!','n'],
['t','Understandable, have a great rest of the week dear customer.'],
['@bg','home'],['@who','n'],
['N','Nyra departed towards her home. After walking for 5 minutes she arrived at a modest looking house. There was a little yard in front of it. If you’re wondering why she can afford to live there, it’s because it’s her parents’ house. They were both absent though because… better not think about it.'],
['N','After locking the door, she got a little excited and a little worried she just got scammed out of 100 money.'],
['y','I’ll check it out later, I’ll take a quick shower first.'],
['N','After she was nice and refreshed Nyra went to her bedroom, then opened the scroll. There were instructions, like Tufel said. Ritual of Fulfillment: Never one, without the other.'],
['N','Prepare a quiet and dark room. Make a circle using 7 red petals of roses and make a circle with 3 candles inside. Write your deepest desire on a sheet of paper in a single sentence then close and put it into the middle. Offer something of sentimental value for your ritual and place it on top of it. Ask for it out loud 3 times and it’s done!'],
['y','Looks like a wish of sorts maybe? Wouldn’t that be the dream…','p'],
['N','After a bit of fantasizing Nyra went outside near her garden and collected some rose petals, then got some candles from the living room. She was a bit worried about the sentimental item though. She didn’t own anything like an heirloom. Her eyes drifted to the bookshelf.'],
['y','Hmmm I don’t really have any heirloom or rings from my family I could use… wait do my mangas count? I am quite attached to those, so it could work!','n'],
['N','After making up her mind she got to making the note. She pondered for a while on what she wanted and started writing. After about 10 minutes she thought of a good enough idea. She wrote:'],
['N','“'+W+'”'],
['~','Seems sincere enough.'],
['@bg','dark'],
['N','The curtains were being closed so the room was covered in darkness. Using her phone screen to see a bit she lit the three candles. She made a circle pattern with the 7 rose petals, followed by putting in the candles. After making a small triangle with them Nyra put the folded letter in the middle and her favourite yuri manga on top of it.'],
['N','It was about a pink haired demon maid who loved cats and girls. She felt very seen while reading it and loved it with all her soul. It was a limited edition signed by the author as well! Truly a one of a kind treasure.'],
['~','Anyways it was time to try out the ritual! Though it will most likely not work.'],
['N','Nyra got on her knees in front of it and said:'],
['y',W],
['N','Suddenly one of the candles got brighter and a little… redder? Maybe a soft pink would be the better word to describe it? To Nyra’s shock something was actually happening! Suddenly a burst of excitement hit her and she almost stopped with the wishing. Suppressing her curiosity she focused up and repeated the phrase again:','s'],
['y',W],
['N','Another candle lit up! The new one was a little more pink than the last one, and it gave off a nice aroma. Nyra started getting a bit hopeful and eager, thinking it might actually work! Her mind started to make up fantasies of what might happen when it’s done so she quickly recited it for the last time.','p'],
['y',W],
['@bg','fire'],['@cg','flame'],
['N','As the final candle lit up in a pure crimson red color, all the flames surged in size and intensity! The flames grew and grew until a fiery pillar of crimson and pink was inside the rose circle, seemingly unable to go outside it. But it also meant her manga got burned! The pain!!'],
['@cg',''],['@who','n'],
['N','Ignoring her aching heart she focused on the situation at hand. Cold sweat started forming on Nyra’s back as this phenomenon occurred. The flames showed no signs of stopping, and they were getting dangerously wild.','s'],
['~','This is getting a bit out of hand, what if my house burns down!!'],
['N','She quickly turned around to get some water, but just as she reached for the handle a voice came from the flames:'],

['m','Hello there Nyra.'],
['N','Nyra turned around in panic.'],
['~','Did the flame just call out my name??','s'],
['N','The flames were still surging and a faint silhouette could be seen inside. It was hard to make out but it had a slender build and a horn on the right side of its head. Anxiously she responded:'],
['y','Who are you? And how do you know my name!?'],
['m','I am Mirel. I know your name since it was written on the contract?'],
['y','The contract? Is it connected to the ritual? I guess it would be since it was for buying the ritual… But still, how are you alive in flames! Aren’t you burning??','n'],
['m','They don’t really burn me, I’m a demon after all.'],
['y','A DEMON!?!','s'],
['N','Nyra fell on her bottom from shock and hit the floor.'],
['y','PLEASE DON’T EAT ME I PROBABLY DON’T TASTE GOOD!','c'],
['N','Nyra peeked up from the floor ready to beg, but the words died in her throat as the flames calmed down and a figure began to appear.'],
['@sil',''],['@bg','home'],
['N','A stunning young girl stood where the flames had been. She had shoulder length pink hair, with two strands that extended down to her chest and a red horn. Wearing a grape brown maid outfit with crimson jewels and trimmed white frill, her eyes stared deeply into Nyra. Her eyes were what stood out the most, with their crimson pink glow and sharp pupils that could cut worlds.','p'],
['N','Both of them look at the other with mesmerized gazes.'],
['M','(She’s so adorable!!!)','h'],
['~','(She’s so stunning!!!)','p'],
['N','It was love at first sight! Nyra bowed deeply to hide her flustered face but her tail was jumping around like crazy! She felt like her heart might explode from the shock! The wish actually worked!! Well sorta, she is still a demon but that makes her even cooler! Still hiding her face in the floor she blurted:','b'],
['y','Mirel you are the prettiest person I have ever seen in my life, would you please let me be your girlfriend? I would love to get to know you better!','b'],
['N','Mirel snapped out of her daze and stared blankly at Nyra as her thoughts wandered and panicked.'],
['M','Huh? Did she just confess? To me? Didn’t we just meet?? Is this how people introduce themselves up here? Well… she is a cutie, her voice is cute, her ears are so puffy and she looks so soft I just wanna cuddle her and squish her into a ball and hold her forever….','s'],
['N','Mirel studied her for a long moment, the cute ears, the utterly sincere face still red with embarrassment. She heard demons usually didn’t get THIS kind of welcome. After pondering for a full minute she responded:'],
['m','Sure, you’re exactly my type! But before I can accept you have to remove the petals around me, I can’t leave unless you do.'],
['y','REALLY!?','p'],
['N','Nyra instantly got to picking up the petals one by one, catching a whiff of Mirel in the process.'],
['~','She smells so nice…','b'],
['N','As the final petal got picked up Mirel suddenly lunged at her! She caught her hands with one arm and trapped her legs with her own! Nyra made a surprised noise and closed her eyes, her heart pounding with fear and excitement!'],
['~','She’s so strong…','b'],
['N','Mirel made a gentle smile and whispered into her ear:'],
['m','If you really want to be my girlfriend I will have to put a seal on you. If you are to ever try to get into a romantic relationship with anyone but me, it will kill you and me both. Are you willing to carry that burden?'],
['N','Nyra’s face was entirely red at this point, and she immediately nodded.'],
['m','Good girl~','y'],
['N','She pulled down a bit of Nyra’s sweater and bit down behind her neck.'],
['y','Mmnggh!','c'],
['N','Nyra made a pained sound with a tear dwelling in her eye, but for some reason it also didn’t feel too bad…'],
['~','I’m feeling a bit tired though…','d'],
['N','Behind her neck a symbol that looks like a mixture of a hickey and a heart revealed itself, bonding the two of them together.'],
['m','There you go, all done! Sorry for being so aggressive, you’re just too cute!','h'],
['N','Mirel started patting the place she just bit so it wouldn’t hurt as much and gave her a small kiss on the cheek. After that Nyra lost consciousness from exhaustion.'],
['@bg','dream'],['@who',''],
['N','…'],
['@bg','home'],['@who','n'],
['N','She woke up on her bed to the smell of delicious food. It felt like she just had the most wonderful dream…','d'],
['N','After rubbing her eyes she looked around. Her room was spotlessly clean and there was a plate of food next to her bed. There were some lemon muffins and water. Just then she also felt someone else on her bed. She immediately turned to see Mirel also laying there!','s'],
['N','She looked even prettier up close, her pink hair flowing down while her pink eyelids almost glittered. She also seemed to be wearing a magenta colored sweater which suited her very much. Where did she even get that? At the same moment she also remembered what happened before and touched her nape. It didn’t feel any different from before, I guess it healed up rather quickly.','b'],
['~','PURE THOUGHTS NYRA! There’s no way I can do anything to the sleeping beauty lying on my bed.','b'],
['N','After debating for a while she got up and ate the muffins. They tasted so good she could cry. She ate two and went to the bathroom to brush her teeth and inspect herself in the mirror. Luckily she also had a handheld one so she could inspect her nape.','c'],
['~','It almost looks like some sort of tattoo, that’s pretty cool!','p'],
['N','She got back after she washed up in the shower and returned to the bed. Just as she laid down she noticed that Mirel had woken up.','n'],
['@who','nm'],
['m','Good morning Nyra.'],
['y','Good morning to you too Mirel!','p'],
['N','She laid down and hugged Mirel, which she didn’t seem to mind and wrapped her tail around her.'],
['y','Thank you for letting me be your girlfriend, I promise I will never ever leave you!','l'],
['N','Before she could respond Nyra gave her a kiss on the lips. Somehow they tasted even sweeter than the muffins. Then she felt Nyra relax against her and found herself leaning into the kiss. She closed her eyes and gently held Nyra closer, letting the moment linger a little longer.'],
['@cg','hug'],
['N','Mirel leaned even more into the kiss and wrapped her arms around Nyra. Nyra instantly got flustered and stopped, her face beaming red and her ears dropped. Mirel smiled and held her close then responded:'],
['m','I love you too Nyra.','h'],
['@cg',''],['@chap','Chapter 2'],['@bg','home'],['@who',''],
['N','Mirel was listening to some music while cleaning in the living room. Wearing her maid dress she went from shelf to shelf cleaning until every shelf looked brand new. She was in a pretty good mood today.'],
['N','Looking out the window she saw a small silhouette jump on the fence. It was a black cat with orange eyes. It locked eyes with Mirel for a moment then ran away out of sight. It reminded her of Nyra, which put a slight smile on her face.'],
['N','Mirel was just finished with cleaning so with nothing else to do, she went to the kitchen. After cleaning all this time she became pretty thirsty, so she went to make herself a drink. Sweet iced tea. It was a delicacy from this world she enjoyed a lot. Such sweetness paired with some peaches really hit the spot for her and her sweet tooth.'],
['N','Just then the sound of keys jingling came from the front door.'],
['M','She’s back!','h'],
['@who','nm'],
['N','She walked to the living room to greet Nyra, but just as the door opened a tired face appeared. She looked like she just went on a 5 hour hike without water or food! When she spotted Mirel her eyes became more alive.','c'],
['y','Heya Mirel!','p'],
['N','Mirel approached her and gave her a warm hug.'],
['m','Rough day at work?'],
['y','Yeah, the AC stopped working so we had to work in the suffocating heat until 5! It was like working in purgatory…','d'],
['m','I made some iced tea, I’ll bring it. Go sit on the couch.'],
['y','Kay','n'],
['N','Mirel gave her a little kiss on the forehead, then walking past the red faced kitty she went to the kitchen and poured a glass of iced tea for her. She also made a side of cut peaches to eat since a drink would only make her less thirsty. Nyra greedily drank with pure bliss in her eyes, then ate the peaches one by one, the sweet juices dripping down on the plate. Mirel got a handkerchief and handed it to her to clean her mouth.','b'],
['~','I’m being treated like a kid! …But Mirel is being very thoughtful.','b'],
['y','Thanks for the food, it was very delicious. I’ll go take a quick shower, I’m a stinky mess…','l'],
['N','By the time Nyra came back out, she looked like an entirely different person with her damp soft hair, hot skin, wrapped in an oversized black shirt and wearing shorts, looking as refreshed as ever! Mirel was watching some TV in the meantime. Nyra sat down next to her on the couch and leaned on her shoulder.','p'],
['M','What’s going on!? Nyra had never gotten so close without saying anything or being stunned.','b'],
['N','Nyra’s eyelids were growing heavy and her eyes unfocused. Her head slowly tipped down to Mirel’s lap. Mirel’s thoughts shut down. Not knowing what else to do, she reached out and started petting her head. She gently massaged her scalp with her nails, caressing the fluffy black hair. The fluffy ears started twitching a little, and she decided to massage one of them as well. And as she did she started to hear purring sounds!'],
['M','Purring!! She really is like a cat! How can she be so adorable!?!!','h'],
['N','Feeling the soft vibrations of the purring and the warmth of her head she vowed to not move until Nyra woke up. She was determined to do so even if her legs fell asleep!'],
['N','It completely slipped her mind that the TV was even on, her gaze lingering on Nyra’s sleeping face.'],
['M','I wanna kiss her so bad!! (TvT)','c'],
['N','But since she was sitting she couldn’t quite reach that pretty face or those soft lips. Truly a devastating turn of events!'],
['N','She could still enjoy the warm little furrball though, so she reached for the blanket on the side and covered Nyra so she wouldn’t get cold. Still petting her she closed her eyes and fell asleep shortly after.'],
['@who','n'],
['N','Nyra woke up on the warmest pillow she had ever slept on. The rumbling in her stomach made her come to her senses.','d'],
['y','I could eat a whole horse!','s'],
['N','She also realized the comfy pillow was Mirel’s thighs! She looked up and saw Mirel also sleeping soundly. Nyra wished to stay like this forever, but her rumbling stomach protested…','b'],
['~','Curse you nutritional needs!!','c'],
['N','She gave Mirel a little kiss and stretched. Tonight she was going to make dinner! She felt that her girlfriend did too much for her and felt indebted so it was the least she could do. Putting on a cute apron, Nyra decided to make some pasta. It was one of the rare dishes she could make that wasn’t instant noodles or eggs.','n'],
['N','While the water heated up, she leaned against the counter and looked back at the couch. Mirel hadn’t moved, still sound asleep. Nyra dumped lots of pasta into the water because she was feeling as gluttonous as a whale tonight. Nyra was just pouring the sauce into the pan when she heard footsteps behind her.'],
['@who',''],['@cg','hoodie'],
['N','Before she could turn around, arms wrapped around her from behind, a face pressing quietly into her shoulder.'],
['y','…Mirel?','b'],
['N','No response from her though, she just loomed over her shoulder and nibbled on it quietly.'],
['y','Sorry for ditching you on the couch, I was starving…'],
['N','Still nothing. Mirel just held on tighter and nibbled harder. The nibbles didn’t help one bit as Nyra’s face started getting as red as a tomato. She was becoming more flustered and restless by the minute.'],
['y','Geez you’re such a tease! Is there anything I can do to make it up to you?','b'],
['m','Turn off the stove. Dinner can wait.','y'],
['N','Nyra’s heart skipped a beat. She did as Mirel instructed and turned off the heat.'],
['y','…I’m still hungry, though','b'],
['m','Mm. So am I.','y'],
['@cg',''],['@bg','home'],['@who','n'],
['N','Some time later, Mirel was humming a happy tune to herself as she reheated the pasta, looking energized and satisfied. Nyra sat slumped at the table, staring blankly at nothing in particular, hair a mess and legs not fully trustworthy yet. She had hickeys hidden under her thrown-on sweater.','g'],
['m','Dinner is ready!','h'],

['N','Mirel brought the food to the table, and they ate the rest of their meal in comfortable silence. Once they’d both eaten their fill, they cleaned up together, showered, and headed to bed. Sleep came easy, and their dreams were sweet.','p'],

var SAVE='nyramirel_save_v2';
function gs(){try{return parseInt(localStorage.getItem(SAVE))||0}catch(e){return 0}}
function ps(n){try{if(n>0)localStorage.setItem(SAVE,String(n));else localStorage.removeItem(SAVE)}catch(e){}}
var $=function(x){return document.getElementById(x)};
var scene=$('scene'),txt=$('txt'),nm=$('name'),more=$('more'),cg=$('cg'),spN=$('spN'),spM=$('spM'),spT=$('spT'),menu=$('menu'),setp=$('set');
var i=0,typing=null,full='',started=false,panel=false,sil=false,confirmReset=false;
spT.innerHTML='<img src="'+IM.tufel+'" alt="Tufel">';
menu.style.backgroundImage='url('+IM.menu+')';
function show(id){$(id).style.display='flex'}function hide(id){$(id).style.display='none'}
function who(w){spN.classList.toggle('on',w.indexOf('n')>-1);spM.classList.toggle('on',w.indexOf('m')>-1);spT.classList.toggle('on',w.indexOf('t')>-1)}
function setEmo(e){spN.innerHTML='<img src="'+IM[EMO[e]]+'" alt="Nyra">';spN.classList.toggle('half',e==='n');spN.classList.toggle('chibi',e!=='n')}
function setM(k){var key=k==='top'?'mtop':k==='k'?'mthink':MK[k];spM.innerHTML='<img src="'+IM[key]+'" alt="Mirel">';spM.classList.toggle('half',k==='top');spM.classList.toggle('chibi',k!=='top')}
function label(){$('play').textContent=gs()>0?'Continue':'Start'}
function reset(){scene.className='bg-town';scene.style.backgroundImage='';who('');setEmo('n');setM('top');sil=false;spM.classList.remove('sil');cg.style.display='none';cg.innerHTML='';$('sprites').style.visibility='visible'}
function dir(c,v,quiet){
  if(c==='@bg'){if(v==='dream'){scene.className='bg-dream';scene.style.backgroundImage='url('+IM.dream+')'}else{scene.className='bg-'+v;scene.style.backgroundImage=''}}
  else if(c==='@who'){who(v);if(v.indexOf('n')>-1)setEmo('n');if(v.indexOf('m')>-1)setM('top')}
  else if(c==='@cg'){cg.style.display=v?'flex':'none';cg.innerHTML=v?'<img src="'+IM[v]+'" alt="">':'';$('sprites').style.visibility=v?'hidden':'visible'}
  else if(c==='@sil'){sil=!!v;spM.classList.toggle('sil',sil);if(sil)setM('top')}
  else if(c==='@chap'&&!quiet){$('chapT').textContent=v;show('chap');return 1}
  else if(c==='@end'&&!quiet){ps(0);show('end');return 1}
}
function ems(l){
  var sp=l[0];
  if(sp==='m'||sp==='M')setM(sil?'top':(MK[l[2]]?l[2]:(sp==='M'?'k':'top')));
  else if(l[2])setEmo(l[2]);
}
function step(){
  while(L[i][0].charAt(0)==='@'){var r=dir(L[i][0],L[i][1],false);i++;if(r)return}
  var l=L[i],sp=l[0];ems(l);ps(i);
  nm.textContent=NAMES[sp]||'';
  txt.className=sp==='N'?'nar':(sp==='~'||sp==='M')?'tho':'';
  var id=sp==='~'?'y':sp==='M'?'m':sp,map={y:spN,m:spM,t:spT};
  [spN,spM,spT].forEach(function(s){s.classList.remove('talk','dim');if(sp==='N')return;if(s===map[id])s.classList.add('talk');else s.classList.add('dim')});
  full=l[1];txt.textContent='';more.style.visibility='hidden';
  var k=0;clearInterval(typing);
  typing=setInterval(function(){k++;txt.textContent=full.slice(0,k);if(k>=full.length)fin()},16);
}
function fin(){clearInterval(typing);typing=null;txt.textContent=full;more.style.visibility='visible'}
function advance(){
  if(!started||panel||$('end').style.display==='flex')return;
  if($('chap').style.display==='flex'){hide('chap');step();return}
  if(typing){fin();return}
  i++;step();
}
function startAt(n){
  reset();clearInterval(typing);hide('menu');hide('end');hide('chap');
  for(var k=0;k<n&&k<L.length;k++){var l=L[k];if(l[0].charAt(0)==='@')dir(l[0],l[1],true);else ems(l)}
  i=n;started=true;step();
}
function toMenu(){started=false;clearInterval(typing);typing=null;hide('end');hide('chap');label();show('menu')}
function closePanel(){panel=false;hide('set');confirmReset=false;$('bReset').textContent='Reset game'}
$('play').onclick=function(){startAt(gs())};
$('again').onclick=function(e){e.stopPropagation();ps(0);startAt(0)};
$('gear').onclick=function(){if(panel){closePanel();return}panel=true;$('bMenu').style.display=started?'':'none';show('set')};
$('bResume').onclick=function(){closePanel();if(!started)startAt(gs())};
$('bMenu').onclick=function(){closePanel();toMenu()};
$('bReset').onclick=function(){
  if(!confirmReset){confirmReset=true;this.textContent='Tap again to confirm';return}
  ps(0);closePanel();toMenu();
};
$('chap').onclick=advance;$('end').onclick=function(){};
$('box').addEventListener('click',advance);
document.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){if(document.activeElement&&document.activeElement.tagName==='BUTTON')return;e.preventDefault();advance()}});
label();show('menu');
})();
</script>
